name: Validate profile assets

on:
  pull_request:
  push:
    paths:
      - "README.md"
      - "assets/**"
      - "profile_assets/**"
      - "scripts/**"
      - "generate.py"
      - "validate.py"
      - "requirements.txt"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install -r requirements.txt
      - run: python validate.py
